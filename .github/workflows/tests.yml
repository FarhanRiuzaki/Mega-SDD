name: mega-sdd tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the docs-only detector diffs event.before..sha, which
          # a depth-1 clone cannot resolve (detector would silently never skip)
          fetch-depth: 0

      # CI diet: cache the npm store so the pinned claude-code CLI install is a
      # cache hit instead of a fresh download every run.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: .github/workflows/tests.yml

      # CI diet (v7 Fase 2, user-approved): a push that touches ONLY docs/,
      # research/, or root-level *.md skips the SUITE LOOP (nothing executable
      # changed) — manifest + pack validation below still run on every push,
      # exactly per the gate decision ("manifest-validate tetap").
      - name: Detect docs-only push
        id: docsonly
        run: |
          set -e
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if ! git rev-parse -q --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            echo "skip_suite=false" >> "$GITHUB_OUTPUT"; exit 0   # forced push / first push: run everything
          fi
          CHANGED=$(git diff --name-only "$RANGE")
          if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|research/|[^/]+\.md$)'; then
            echo "docs-only push — suite loop skipped"; echo "skip_suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_suite=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator deps
        run: pip install pyyaml

      - name: Run shell test suites (both test trees)
        if: steps.docsonly.outputs.skip_suite != 'true'
        # Covers BOTH suite trees — plugins/mega-sdd/tests/ AND the repo-root tests/ —
        # and both naming conventions (test-*.sh and *.test.sh). Previously only the
        # plugin tree was scanned, leaving ~50 enforcement-pinning suites un-run (R3-13).
        # Each suite's stdin is /dev/null so a suite that reads stdin (e.g. the hook
        # tests that pipe JSON) cannot consume this while-read loop's input.
        #
        # Quarantined (intentionally excluded, NOT a coverage gap): three pack suites
        # that merely re-wrap `validate-pack.sh --all` / `--check-registry` — already
        # enforced by the two dedicated pack steps below. They are heavy/redundant in
        # the shell loop; excluding them keeps this gate fast without losing coverage.
        run: |
          rc=0
          while IFS= read -r t; do
            echo "== $t =="
            bash "$t" </dev/null || { echo "FAILED: $t"; rc=1; }
          done < <(
            find plugins/mega-sdd/tests tests \( -name 'test-*.sh' -o -name '*.test.sh' \) \
              | grep -vE 'tests/(pack-kit/test-registry-fresh|per-stack-packs/test-all-full-ready|per-stack-packs/test-all-green)\.sh$' \
              | sort
          )
          exit $rc

      - name: Validate plugin manifests (claude plugin validate)
        # A1 (spec 2026-08-17-delta-hygiene-a1-a4): blocks on manifest field/schema
        # ERRORS (the misspelled-plugin.json class). Plain mode, NOT --strict: the
        # root-CLAUDE.md warning flags our DELIBERATE contributor contract. CLI pin
        # 2.1.233 joins the registry-rot review checklist (CLAUDE.md §Versioning).
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.233
          claude plugin validate plugins/mega-sdd

      - name: Validate framework-convention packs
        # Tier-aware aggregate gate: `full` packs block on any violation; thin /
        # untiered overlays (e.g. laravel-base-26.md, which extends laravel and is
        # intentionally incomplete) block only on structural errors (invalid YAML /
        # cross-framework leak). This is the script's documented green-CI gate —
        # per-pack single mode wrongly fails the untiered overlays.
        run: bash plugins/mega-sdd/scripts/validate-pack.sh --all

      - name: Check pack registry is fresh
        run: bash plugins/mega-sdd/scripts/validate-pack.sh --check-registry
