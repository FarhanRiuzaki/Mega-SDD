# Per-tool: install command + verify command per (os, pkg_mgr) combo.
# Consumed by install-deps SKILL.md Step 3 (build install plan) + Step 5 (execute) + Step 6 (verify).
#
# See also: plugins/mega-sdd/references/tooling-install.md — human-readable install guide
# (manual reference; tool-matrix.yaml is the machine-readable canonical for auto-install).

schema_version: "1.0"

tools:
  - id: tree-sitter
    used_by: [scan-codebase]
    purpose: "AST-precise symbol extraction (scan-codebase)"
    fallback_behavior: "Regex engine (lower precision)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install tree-sitter"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 5
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "command -v tree-sitter-cli"
        size_mb: 5
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "command -v tree-sitter-cli"
        size_mb: 5
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install tree-sitter"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 6
        notes: "scoop is the native Windows source for tree-sitter (per tree-sitter docs); no winget package"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install tree-sitter-cli"
        verify_cmd: "command -v tree-sitter-cli"
        size_mb: 8
        notes: "Cross-platform fallback when no native pkg available (incl. Windows w/ Rust)"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g tree-sitter-cli"
        verify_cmd: "command -v tree-sitter-cli"
        size_mb: 6
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ast-grep
    used_by: [execute-bolts, generate-units]
    purpose: "Hard Rule v2 grammar (5-10x expressivity vs v1)"
    fallback_behavior: "v1 grammar (5 closed types)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ast-grep"
        verify_cmd: "command -v ast-grep"
        size_mb: 8
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "cargo install ast-grep"
        requires_sudo: false
        verify_cmd: "command -v ast-grep"
        size_mb: 12
        notes: "No native apt pkg; cargo is the canonical install for ast-grep on Debian/Ubuntu"
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ast-grep"
        verify_cmd: "command -v ast-grep || command -v sg"
        size_mb: 10
        notes: "scoop is the native Windows source (matches references/tooling-install.md); no winget package"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ast-grep --locked"
        verify_cmd: "command -v ast-grep"
        size_mb: 12
        notes: "Cross-platform fallback (incl. Windows w/ Rust)"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g @ast-grep/cli"
        verify_cmd: "command -v ast-grep"
        size_mb: 10
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ripgrep
    used_by: [scan-codebase, bind-codebase, detect-drift, lint-units]
    purpose: "Fast structured grep (JSON output)"
    fallback_behavior: "GNU grep (slower; no JSON)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y ripgrep"
        requires_sudo: true
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y ripgrep"
        requires_sudo: true
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install BurntSushi.ripgrep.MSVC"
        verify_cmd: "command -v rg"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 4
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 5

  - id: jd
    used_by: [diff-vault]
    purpose: "Canonical JSON/YAML diff with RFC-6902 patches"
    fallback_behavior: "Manual Read+compare via skill body"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install jd"
        verify_cmd: "command -v jd"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install jd"
        verify_cmd: "command -v jd"
        size_mb: 8
        notes: "scoop native Windows source; otherwise the go fallback below"
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/josephburnett/jd@latest"
        verify_cmd: "command -v jd"
        size_mb: 8
        notes: "Cross-platform fallback (incl. Windows w/ Go)"

  - id: pandoc
    used_by: [emit-fsd]
    purpose: "FSD PDF rendering (emit-fsd)"
    fallback_behavior: "Markdown-only output (no PDF)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 20
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y pandoc"
        requires_sudo: true
        verify_cmd: "command -v pandoc"
        size_mb: 25
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y pandoc"
        requires_sudo: true
        verify_cmd: "command -v pandoc"
        size_mb: 25
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install JohnMacFarlane.Pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 30
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 30

  - id: tectonic
    used_by: [emit-fsd]
    purpose: "LaTeX engine for FSD PDF (lighter alternative to BasicTeX54)"
    fallback_behavior: "HTML output (browser print-to-PDF) when neither tectonic nor xelatex available"
    notes: "Recommended over BasicTeX (~2GB) — tectonic is ~50MB self-contained"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install tectonic"
        verify_cmd: "command -v tectonic"
        size_mb: 50
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "cargo install tectonic"
        verify_cmd: "command -v tectonic"
        size_mb: 60
        notes: "No native apt pkg in older Ubuntu; cargo fallback"
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install tectonic"
        verify_cmd: "command -v tectonic"
        size_mb: 60
        notes: "scoop native Windows source (per tectonic docs); no winget package"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install tectonic"
        verify_cmd: "command -v tectonic"
        size_mb: 60
        notes: "Cross-platform fallback (incl. Windows w/ Rust)"

  - id: markdownlint-cli2
    used_by: [lint-units]
    purpose: "Vault prose lint (optional)"
    fallback_behavior: "Skill-internal heuristic checks"
    matrix:
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g markdownlint-cli2"
        verify_cmd: "command -v markdownlint-cli2"
        size_mb: 2
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install markdownlint-cli2"
        verify_cmd: "command -v markdownlint-cli2"
        size_mb: 2

  - id: gh
    used_by: [execute-bolts]
    purpose: "GitHub CLI for PR automation (optional)"
    fallback_behavior: "Manual PR creation"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install gh"
        verify_cmd: "command -v gh"
        size_mb: 30
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y gh"
        requires_sudo: true
        verify_cmd: "command -v gh"
        size_mb: 30
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install GitHub.cli"
        verify_cmd: "command -v gh"
        size_mb: 35

  - id: semgrep
    used_by: [execute-bolts]
    purpose: "SAST scan on bolt diffs (L0 code gates)"
    fallback_behavior: "SAST gate SKIPs with a visible note (never silently 'clean')"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install semgrep"
        verify_cmd: "command -v semgrep"
        size_mb: 120
      - os: any
        pkg_mgr: pipx
        install_cmd: "pipx install semgrep"
        verify_cmd: "command -v semgrep"
        size_mb: 120
        notes: "Cross-platform fallback (pipx; pip3 install --user semgrep also works)"

  - id: gitleaks
    used_by: [execute-bolts]
    purpose: "Secret scan on bolt diffs (L0 code gates)"
    fallback_behavior: "Plugin provider-shaped regex fallback (reduced coverage; secrets are always scanned)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install gitleaks"
        verify_cmd: "command -v gitleaks"
        size_mb: 10
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install gitleaks"
        verify_cmd: "command -v gitleaks"
        size_mb: 12
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/zricethezav/gitleaks/v8@latest"
        verify_cmd: "command -v gitleaks"
        size_mb: 15
        notes: "Cross-platform fallback (incl. Linux w/ Go)"

  - id: osv-scanner
    used_by: [execute-bolts]
    purpose: "Cross-ecosystem known-CVE audit of dependency lockfiles (L0 code gates, advisory)"
    fallback_behavior: "Ecosystem-native audit (npm audit / pip-audit / cargo audit / composer audit) when present; else skipped"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install osv-scanner"
        verify_cmd: "command -v osv-scanner"
        size_mb: 30
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install Google.OSVScanner"
        verify_cmd: "command -v osv-scanner"
        size_mb: 35
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/google/osv-scanner/cmd/osv-scanner@v1"
        verify_cmd: "command -v osv-scanner"
        size_mb: 35
        notes: "Cross-platform fallback (incl. Linux w/ Go)"

# Defaults
defaults:
  required_tools: []                                          # ALL tools optional; mega-sdd has graceful fallback for each
  recommended_minimum: [tree-sitter, ast-grep, ripgrep]        # baseline for brownfield projects
  fsd_extension: [pandoc, tectonic]                            # FSD generation
  code_gates: [semgrep, gitleaks, osv-scanner]                 # execute-bolts L0 code gates
  full_stack: [tree-sitter, ast-grep, ripgrep, jd, pandoc, tectonic, markdownlint-cli2, gh, semgrep, gitleaks, osv-scanner]
