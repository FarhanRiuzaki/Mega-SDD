# Per-tool: install command + verify command per (os, pkg_mgr) combo.
# Consumed by install-deps SKILL.md Step 3 (build install plan) + Step 5 (execute) + Step 6 (verify).
#
# See also: plugins/mega-sdd/references/tooling-install.md — human-readable install guide
# (manual reference; tool-matrix.yaml is the machine-readable canonical for auto-install).

schema_version: "1.0"

tools:
  - id: python3
    used_by: [hooks]
    purpose: "Every mega-sdd hook parses its stdin JSON through python3 — the gate aggregator and the validators depend on it"
    fallback_behavior: "NONE. This is the one genuinely REQUIRED tool: without a usable interpreter the hooks fail closed (execute-bolts is blocked) and SessionStart emits a degraded-mode notice. It is not optional and has no graceful path."
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install python@3.14"
        verify_cmd: "python3 -V"
        size_mb: 70
        notes: "Formula aliases python/python3/python@3 all resolve here; installs $HOMEBREW_PREFIX/bin/python3"
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y python3"
        requires_sudo: true
        verify_cmd: "python3 -V"
        size_mb: 30
        notes: "Metapackage; python-is-python3 is only for a bare `python` name and is NOT needed"
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y python3"
        requires_sudo: true
        verify_cmd: "python3 -V"
        size_mb: 30
        notes: "The bare `python` name comes from the separate package python-unversioned-command (not python3-unversioned-command)"
      - os: linux
        pkg_mgr: pacman
        install_cmd: "sudo pacman -S --needed python"
        requires_sudo: true
        verify_cmd: "python3 -V"
        size_mb: 73
        notes: "No python3 package exists on Arch; core/python IS 3.x and ships /usr/bin/python3"
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install python"
        verify_cmd: "python3 -V"
        size_mb: 110
        notes: "PREFERRED Windows route — the ONLY package-manager route that yields a working `python3` command. Its manifest declares a python3 shim, and the scoop installer PREPENDS the shims dir to PATH, so it beats the WindowsApps alias stub. Per-user, no admin, no Group Policy surface. PRECONDITION: scoop must ALREADY be installed — its official bootstrap is PowerShell-only (`Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` then `irm get.scoop.sh | iex`). On a corporate image where PowerShell is blocked by policy this route CANNOT be bootstrapped; fall back to the winget row below and verify with `python`, not `python3` (resolve-python.sh's ladder falls through to it)."
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget --scope user -e --id Python.Python.3.14"
        verify_cmd: "python -V"
        size_mb: 110
        notes: "Verify with `python`, NOT `python3` — the python.org/winget installer ships python.exe/py.exe/pythonw.exe and NEVER python3.exe (CPython PC/layout: the alias3 option is in no preset). PATH is prepended, but there is no python3.exe to override the WindowsApps stub with, so `python3` STILL resolves to the stub after a successful install. mega-sdd's resolve-python.sh ladder falls through to `python` and works. The ID pins a minor — there is no floating Python.Python.3 — so re-verify when 3.15 lands (~Oct 2026)."
      - os: windows-bash
        pkg_mgr: choco
        install_cmd: "choco install -y python3"
        requires_sudo: true
        verify_cmd: "python -V"
        size_mb: 110
        notes: "Needs an elevated shell; same missing-python3 caveat as winget"

  - id: tree-sitter
    used_by: [scan-codebase]
    purpose: "scan-codebase OPT-IN lane only (--engine=tree-sitter; auto uses ast-grep)"
    fallback_behavior: "auto is unaffected — ast-grep serves tier ast; without it, regex"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install tree-sitter-cli"
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 5
        notes: "The brew tree-sitter formula is library-only; the CLI ships as tree-sitter-cli (binary name: tree-sitter)"
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 5
        notes: "Ubuntu 24.04+/Debian 13+ only; older releases use the cargo/npm fallback rows"
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 5
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget tree-sitter.tree-sitter-cli"
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 6
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install tree-sitter"
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 6
        notes: "scoop is a native Windows source for tree-sitter (per tree-sitter docs); winget tree-sitter.tree-sitter-cli also available"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install tree-sitter-cli"
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 8
        notes: "Cross-platform fallback when no native pkg available (incl. Windows w/ Rust)"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g tree-sitter-cli"
        verify_cmd: "tree-sitter --version || tree-sitter-cli --version"
        size_mb: 6
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ast-grep
    used_by: [scan-codebase, execute-bolts, generate-units, detect-drift]
    purpose: "scan-codebase tier-2 AST extraction (zero-compilation — the OOM-safe tier) + Hard Rule v2 grammar (5-10x expressivity vs v1)"
    fallback_behavior: "scan falls to the regex tier (lower precision); v1-authored rules run natively; units already carrying v2 rules HALT dep_missing until installed"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ast-grep"
        verify_cmd: "ast-grep --version"
        size_mb: 8
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget ast-grep.ast-grep"
        verify_cmd: "ast-grep --version"
        size_mb: 10
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ast-grep"
        verify_cmd: "ast-grep --version"
        size_mb: 10
        notes: "scoop is a native Windows source (matches references/tooling-install.md); winget ast-grep.ast-grep also available"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ast-grep --locked"
        verify_cmd: "ast-grep --version"
        size_mb: 12
        notes: "Cross-platform fallback (incl. Windows w/ Rust); covers Debian/Ubuntu — no native apt pkg for ast-grep"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g @ast-grep/cli"
        verify_cmd: "ast-grep --version"
        size_mb: 10
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ripgrep
    used_by: [scan-codebase]
    purpose: "Fast structured grep (JSON output)"
    fallback_behavior: "GNU grep (slower; no JSON)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ripgrep"
        verify_cmd: "rg --version"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y ripgrep"
        requires_sudo: true
        verify_cmd: "rg --version"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y ripgrep"
        requires_sudo: true
        verify_cmd: "rg --version"
        size_mb: 3
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget BurntSushi.ripgrep.MSVC"
        verify_cmd: "rg --version"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ripgrep"
        verify_cmd: "rg --version"
        size_mb: 4
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ripgrep"
        verify_cmd: "rg --version"
        size_mb: 5

  - id: jd
    used_by: [diff-vault, execute-bolts]
    purpose: "Canonical JSON/YAML diff with RFC-6902 patches"
    fallback_behavior: "Manual Read+compare via skill body"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install jd"
        verify_cmd: "jd --version"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget josephburnett.jd"
        verify_cmd: "jd --version"
        size_mb: 8
        notes: "winget ships jd 2.x; avoids the scoop extras-bucket step"
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop bucket add extras && scoop install jd"
        verify_cmd: "jd --version"
        size_mb: 8
        notes: "jd lives in the scoop 'extras' bucket (not Main), so the bucket-add is required first; or use the winget row above"
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/josephburnett/jd/v2/jd@latest"
        verify_cmd: "jd --version"
        size_mb: 8
        notes: "Cross-platform fallback (incl. Windows w/ Go); v2 is the current major (the v1 diff format is not compatible)"

  - id: pandoc
    used_by: [emit-fsd, emit-prd, emit-sit, emit-uat]
    purpose: "md2pdf HTML render for the emit PDF lanes (emit-fsd/prd/sit/uat)"
    fallback_behavior: "Markdown-only output (no PDF)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install pandoc"
        verify_cmd: "pandoc --version"
        size_mb: 20
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y pandoc"
        requires_sudo: true
        verify_cmd: "pandoc --version"
        size_mb: 25
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y pandoc"
        requires_sudo: true
        verify_cmd: "pandoc --version"
        size_mb: 25
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget JohnMacFarlane.Pandoc"
        verify_cmd: "pandoc --version"
        size_mb: 30
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install pandoc"
        verify_cmd: "pandoc --version"
        size_mb: 30

  - id: mmdc
    used_by: [emit-fsd, emit-prd, emit-sit, emit-uat]
    purpose: "mermaid-cli — pre-render ```mermaid blocks to SVG for the md2pdf PDF lane (mermaid-flows is a hard rule)"
    fallback_behavior: "mermaid rendered as a code block, not a diagram (visible quality drop)"
    notes: "The PDF render engine is scripts/md2pdf.sh (pandoc HTML + Chrome print, GitHub/VS Code style — NEVER LaTeX). Chrome/Chromium is the printer: it is a GUI app, detect-only (probed by md2pdf.sh), NOT installed here; absent → GitHub-styled HTML fallback."
    matrix:
      - os: macos
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "mmdc --version"
        size_mb: 15
      - os: [linux, wsl]
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "mmdc --version"
        size_mb: 15
      - os: windows-bash
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "mmdc --version"
        size_mb: 15

  - id: markdownlint-cli2
    used_by: [orchestrate-flow]
    purpose: "Vault prose lint (optional)"
    fallback_behavior: "Skill-internal heuristic checks"
    matrix:
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g markdownlint-cli2"
        verify_cmd: "markdownlint-cli2 --version"
        size_mb: 2
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install markdownlint-cli2"
        verify_cmd: "markdownlint-cli2 --version"
        size_mb: 2

  - id: semgrep
    used_by: [execute-bolts]
    purpose: "SAST scan on bolt diffs (L0 code gates)"
    fallback_behavior: "SAST gate SKIPs with a visible note (never silently 'clean')"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install semgrep"
        verify_cmd: "semgrep --version"
        size_mb: 120
      - os: windows-bash
        pkg_mgr: pipx
        install_cmd: "pipx install semgrep"
        verify_cmd: "semgrep --version"
        size_mb: 120
        notes: "Windows route via pipx (Python-based; no winget/scoop semgrep pkg)"
      - os: any
        pkg_mgr: pipx
        install_cmd: "pipx install semgrep"
        verify_cmd: "semgrep --version"
        size_mb: 120
        notes: "Cross-platform fallback (pipx; pip3 install --user semgrep also works)"

  - id: gitleaks
    used_by: [execute-bolts]
    purpose: "Secret scan on bolt diffs (L0 code gates)"
    fallback_behavior: "Plugin provider-shaped regex fallback (reduced coverage; secrets are always scanned)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install gitleaks"
        verify_cmd: "gitleaks --version"
        size_mb: 10
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install --source winget Gitleaks.Gitleaks"
        verify_cmd: "gitleaks --version"
        size_mb: 12
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install gitleaks"
        verify_cmd: "gitleaks --version"
        size_mb: 12
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/zricethezav/gitleaks/v8@latest"
        verify_cmd: "gitleaks --version"
        size_mb: 15
        notes: "Cross-platform fallback (incl. Linux w/ Go)"

# Defaults
defaults:
  required_tools: [python3]                                   # python3 is the ONE hard dependency: every hook parses stdin JSON through it,
                                                              # and without a usable interpreter the gates fail closed. Every OTHER tool is
                                                              # optional and has a documented graceful fallback.
  recommended_minimum: [ast-grep, ripgrep]                     # baseline for brownfield projects (D2: ast-grep IS the auto AST tier; tree-sitter only for the --engine=tree-sitter opt-in lane)
  fsd_extension: [pandoc, mmdc]                              # emit PDF: pandoc HTML + Chrome print (mmdc for mermaid); Chrome detect-only
  code_gates: [semgrep, gitleaks]                              # execute-bolts L0 code gates (secret + SAST); gate 5 dep-existence uses python3 urllib
  full_stack: [python3, tree-sitter, ast-grep, ripgrep, jd, pandoc, mmdc, markdownlint-cli2, semgrep, gitleaks]
