# Per-tool: install command + verify command per (os, pkg_mgr) combo.
# Consumed by install-deps SKILL.md Step 3 (build install plan) + Step 5 (execute) + Step 6 (verify).
#
# See also: plugins/mega-sdd/references/tooling-install.md — human-readable install guide
# (manual reference; tool-matrix.yaml is the machine-readable canonical for auto-install).

schema_version: "1.0"

tools:
  - id: tree-sitter
    used_by: [scan-codebase]
    purpose: "AST-precise symbol extraction (scan-codebase)"
    fallback_behavior: "Regex engine (lower precision)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install tree-sitter-cli"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 5
        notes: "The brew tree-sitter formula is library-only; the CLI ships as tree-sitter-cli (binary name: tree-sitter)"
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 5
        notes: "Ubuntu 24.04+/Debian 13+ only; older releases use the cargo/npm fallback rows"
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y tree-sitter-cli"
        requires_sudo: true
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 5
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install tree-sitter.tree-sitter-cli"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 6
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install tree-sitter"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 6
        notes: "scoop is a native Windows source for tree-sitter (per tree-sitter docs); winget tree-sitter.tree-sitter-cli also available"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install tree-sitter-cli"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 8
        notes: "Cross-platform fallback when no native pkg available (incl. Windows w/ Rust)"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g tree-sitter-cli"
        verify_cmd: "command -v tree-sitter || command -v tree-sitter-cli"
        size_mb: 6
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ast-grep
    used_by: [execute-bolts, generate-units, detect-drift]
    purpose: "Hard Rule v2 grammar (5-10x expressivity vs v1)"
    fallback_behavior: "v1-authored rules run natively; units already carrying v2 rules HALT dep_missing until installed"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ast-grep"
        verify_cmd: "command -v ast-grep"
        size_mb: 8
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install ast-grep.ast-grep"
        verify_cmd: "command -v ast-grep"
        size_mb: 10
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ast-grep"
        verify_cmd: "command -v ast-grep"
        size_mb: 10
        notes: "scoop is a native Windows source (matches references/tooling-install.md); winget ast-grep.ast-grep also available"
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ast-grep --locked"
        verify_cmd: "command -v ast-grep"
        size_mb: 12
        notes: "Cross-platform fallback (incl. Windows w/ Rust); covers Debian/Ubuntu — no native apt pkg for ast-grep"
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g @ast-grep/cli"
        verify_cmd: "command -v ast-grep"
        size_mb: 10
        notes: "Cross-platform fallback (incl. Windows w/ Node)"

  - id: ripgrep
    used_by: [scan-codebase]
    purpose: "Fast structured grep (JSON output)"
    fallback_behavior: "GNU grep (slower; no JSON)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y ripgrep"
        requires_sudo: true
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y ripgrep"
        requires_sudo: true
        verify_cmd: "command -v rg"
        size_mb: 3
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install BurntSushi.ripgrep.MSVC"
        verify_cmd: "command -v rg"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 4
      - os: any
        pkg_mgr: cargo
        install_cmd: "cargo install ripgrep"
        verify_cmd: "command -v rg"
        size_mb: 5

  - id: jd
    used_by: [diff-vault, replay]
    purpose: "Canonical JSON/YAML diff with RFC-6902 patches"
    fallback_behavior: "Manual Read+compare via skill body"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install jd"
        verify_cmd: "command -v jd"
        size_mb: 4
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install josephburnett.jd"
        verify_cmd: "command -v jd"
        size_mb: 8
        notes: "winget ships jd 2.x; avoids the scoop extras-bucket step"
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop bucket add extras && scoop install jd"
        verify_cmd: "command -v jd"
        size_mb: 8
        notes: "jd lives in the scoop 'extras' bucket (not Main), so the bucket-add is required first; or use the winget row above"
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/josephburnett/jd/v2/jd@latest"
        verify_cmd: "command -v jd"
        size_mb: 8
        notes: "Cross-platform fallback (incl. Windows w/ Go); v2 is the current major (the v1 diff format is not compatible)"

  - id: pandoc
    used_by: [emit-fsd, emit-prd, emit-sit, emit-uat]
    purpose: "md2pdf HTML render for the emit PDF lanes (emit-fsd/prd/sit/uat)"
    fallback_behavior: "Markdown-only output (no PDF)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 20
      - os: [linux, wsl]
        pkg_mgr: apt
        install_cmd: "sudo apt install -y pandoc"
        requires_sudo: true
        verify_cmd: "command -v pandoc"
        size_mb: 25
      - os: [linux, wsl]
        pkg_mgr: dnf
        install_cmd: "sudo dnf install -y pandoc"
        requires_sudo: true
        verify_cmd: "command -v pandoc"
        size_mb: 25
      - os: windows-bash
        pkg_mgr: winget
        install_cmd: "winget install JohnMacFarlane.Pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 30
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install pandoc"
        verify_cmd: "command -v pandoc"
        size_mb: 30

  - id: mmdc
    used_by: [emit-fsd, emit-prd, emit-sit, emit-uat]
    purpose: "mermaid-cli — pre-render ```mermaid blocks to SVG for the md2pdf PDF lane (mermaid-flows is a hard rule)"
    fallback_behavior: "mermaid rendered as a code block, not a diagram (visible quality drop)"
    notes: "The PDF render engine is scripts/md2pdf.sh (pandoc HTML + Chrome print, GitHub/VS Code style — NEVER LaTeX). Chrome/Chromium is the printer: it is a GUI app, detect-only (probed by md2pdf.sh), NOT installed here; absent → GitHub-styled HTML fallback."
    matrix:
      - os: macos
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "command -v mmdc"
        size_mb: 15
      - os: [linux, wsl]
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "command -v mmdc"
        size_mb: 15
      - os: windows-bash
        pkg_mgr: npm
        install_cmd: "npm install -g @mermaid-js/mermaid-cli"
        verify_cmd: "command -v mmdc"
        size_mb: 15

  - id: markdownlint-cli2
    used_by: [lint-units]
    purpose: "Vault prose lint (optional)"
    fallback_behavior: "Skill-internal heuristic checks"
    matrix:
      - os: any
        pkg_mgr: npm
        install_cmd: "npm install -g markdownlint-cli2"
        verify_cmd: "command -v markdownlint-cli2"
        size_mb: 2
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install markdownlint-cli2"
        verify_cmd: "command -v markdownlint-cli2"
        size_mb: 2

  - id: semgrep
    used_by: [execute-bolts]
    purpose: "SAST scan on bolt diffs (L0 code gates)"
    fallback_behavior: "SAST gate SKIPs with a visible note (never silently 'clean')"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install semgrep"
        verify_cmd: "command -v semgrep"
        size_mb: 120
      - os: windows-bash
        pkg_mgr: pipx
        install_cmd: "pipx install semgrep"
        verify_cmd: "command -v semgrep"
        size_mb: 120
        notes: "Windows route via pipx (Python-based; no winget/scoop semgrep pkg)"
      - os: any
        pkg_mgr: pipx
        install_cmd: "pipx install semgrep"
        verify_cmd: "command -v semgrep"
        size_mb: 120
        notes: "Cross-platform fallback (pipx; pip3 install --user semgrep also works)"

  - id: gitleaks
    used_by: [execute-bolts]
    purpose: "Secret scan on bolt diffs (L0 code gates)"
    fallback_behavior: "Plugin provider-shaped regex fallback (reduced coverage; secrets are always scanned)"
    matrix:
      - os: macos
        pkg_mgr: brew
        install_cmd: "brew install gitleaks"
        verify_cmd: "command -v gitleaks"
        size_mb: 10
      - os: windows-bash
        pkg_mgr: scoop
        install_cmd: "scoop install gitleaks"
        verify_cmd: "command -v gitleaks"
        size_mb: 12
      - os: any
        pkg_mgr: go
        install_cmd: "go install github.com/zricethezav/gitleaks/v8@latest"
        verify_cmd: "command -v gitleaks"
        size_mb: 15
        notes: "Cross-platform fallback (incl. Linux w/ Go)"

# Defaults
defaults:
  required_tools: []                                          # ALL tools optional; mega-sdd has graceful fallback for each
  recommended_minimum: [tree-sitter, ast-grep, ripgrep]        # baseline for brownfield projects
  fsd_extension: [pandoc, mmdc]                              # emit PDF: pandoc HTML + Chrome print (mmdc for mermaid); Chrome detect-only
  code_gates: [semgrep, gitleaks]                              # execute-bolts L0 code gates (secret + SAST); gate 5 dep-existence uses python3 urllib
  full_stack: [tree-sitter, ast-grep, ripgrep, jd, pandoc, mmdc, markdownlint-cli2, semgrep, gitleaks]
