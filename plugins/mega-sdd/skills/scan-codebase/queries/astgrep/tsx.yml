# Tier-1 AUTO-lane (ast-grep) definition rules — TSX (.tsx; React/Next.js components). Split out of typescript.yml: ast-grep treats tsx as its OWN language and typescript rules never match .tsx
# Kind names verified live against ast-grep 0.42.3 (glossary lab, 2026-08-03).
# Contract (scan-procedure.md §Step 5): --json=compact; range.start.line is
# 0-BASED (+1 for map anchors); `lines` = full node text (signature = first
# line); dedupe rows by (file, start.line, ruleId).
# LANE LAW: every rule's `language:` MUST equal this file's basename — the
# Step-0 router derives its language lanes from pack FILENAMES (the tsx
# regression class: rules parked in another file are invisible to routing).
id: tsx-function
language: tsx
rule: {kind: function_declaration}
---
id: tsx-class
language: tsx
rule: {kind: class_declaration}
---
id: tsx-interface
language: tsx
rule: {kind: interface_declaration}
---
id: tsx-type-alias
language: tsx
rule: {kind: type_alias_declaration}
---
id: tsx-enum
language: tsx
rule: {kind: enum_declaration}
---
id: tsx-method
language: tsx
rule: {kind: method_definition}
---
id: tsx-arrow-binding
language: tsx
rule:
  kind: variable_declarator
  has: {kind: arrow_function}
---
id: tsx-function-expr-binding
language: tsx
rule:
  kind: variable_declarator
  has: {kind: function_expression}
