# Tier-1 AUTO-lane (ast-grep) definition rules — TypeScript (.ts ONLY — .tsx is its own
# ast-grep language and lives in tsx.yml; typescript rules never match .tsx).
# Coverage mirrors the former tags-typescript.scm set (tree-sitter lane removed 7.4.0; ast-grep is the only engine). Kind names verified against ast-grep 0.42.3.
# Consumer contract (scan-procedure.md §Step 5): --json=compact output;
# range.start.line is 0-BASED (+1 for map anchors); `lines` is the full node
# text (signature = first line); dedupe rows by (file, start.line, ruleId).
id: typescript-function
language: typescript
rule: {kind: function_declaration}
---
id: typescript-class
language: typescript
rule: {kind: class_declaration}
---
id: typescript-interface
language: typescript
rule: {kind: interface_declaration}
---
id: typescript-type-alias
language: typescript
rule: {kind: type_alias_declaration}
---
id: typescript-enum
language: typescript
rule: {kind: enum_declaration}
---
id: typescript-method
language: typescript
rule: {kind: method_definition}
---
id: typescript-arrow-binding
language: typescript
rule:
  kind: variable_declarator
  has: {kind: arrow_function}
---
id: typescript-function-expr-binding
language: typescript
rule:
  kind: variable_declarator
  has: {kind: function_expression}
