# Tier-1 AUTO-lane (ast-grep) definition rules — PHP (.php only, not Blade).
# Mirrors tags-php.scm coverage. Kind names verified against ast-grep 0.42.3.
# Contract: 0-based lines (+1 for anchors); dedupe by (file, start.line, ruleId).
id: php-function
language: php
rule: {kind: function_definition}
---
id: php-class
language: php
rule: {kind: class_declaration}
---
id: php-interface
language: php
rule: {kind: interface_declaration}
---
id: php-trait
language: php
rule: {kind: trait_declaration}
---
id: php-method
language: php
rule: {kind: method_declaration}
