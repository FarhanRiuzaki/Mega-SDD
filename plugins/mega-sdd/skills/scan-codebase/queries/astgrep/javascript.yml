# Tier-1 AUTO-lane (ast-grep) definition rules — JavaScript (.js/.jsx/.mjs/.cjs).
# ast-grep's javascript grammar parses JSX, so .jsx files match THESE rules —
# never ship a separate jsx.yml (its rules would double-count every .jsx
# symbol in the index); the Step-0 router carries a jsx->javascript alias.
# Coverage mirrors the former tags-javascript.scm set (tree-sitter lane removed 7.4.0; ast-grep is the only engine). Kind names verified against ast-grep 0.42.3.
# Contract: 0-based lines (+1 for anchors); dedupe by (file, start.line, ruleId).
id: javascript-function
language: javascript
rule: {kind: function_declaration}
---
id: javascript-generator
language: javascript
rule: {kind: generator_function_declaration}
---
id: javascript-class
language: javascript
rule: {kind: class_declaration}
---
id: javascript-method
language: javascript
rule: {kind: method_definition}
---
id: javascript-arrow-binding
language: javascript
rule:
  kind: variable_declarator
  has: {kind: arrow_function}
---
id: javascript-function-expr-binding
language: javascript
rule:
  kind: variable_declarator
  has: {kind: function_expression}
