# Tier-1 AUTO-lane (ast-grep) definition rules — Bash/sh (.sh/.bash)
# Kind names verified live against ast-grep 0.42.3 (glossary lab, 2026-08-03).
# Contract (scan-procedure.md §Step 5): --json=compact; range.start.line is
# 0-BASED (+1 for map anchors); `lines` = full node text (signature = first
# line); dedupe rows by (file, start.line, ruleId).
