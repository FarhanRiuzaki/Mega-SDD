# Tier-1 AUTO-lane (ast-grep) definition rules — Go (.go).
# Coverage mirrors the former tags-go.scm set (tree-sitter lane removed 7.4.0; ast-grep is the only engine). Kind names verified against ast-grep 0.42.3.
# Contract: 0-based lines (+1 for anchors); dedupe by (file, start.line, ruleId).
id: go-function
language: go
rule: {kind: function_declaration}
---
id: go-method
language: go
rule: {kind: method_declaration}
---
id: go-type
language: go
rule: {kind: type_declaration}
